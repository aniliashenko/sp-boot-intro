  databaseChangeLog:
    - changeSet:
        id: 06-create-categories
        author: anton
        changes:
          - createTable:
              tableName: categories
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: name
                    type: VARCHAR(255)
                    constraints:
                      nullable: false
                - column:
                    name: description
                    type: VARCHAR(1000)
                - column:
                    name: is_deleted
                    type: BOOLEAN
                    defaultValueBoolean: false
                    constraints:
                      nullable: false

    - changeSet:
        id: 07-create-book-category
        author: anton
        changes:
          - createTable:
              tableName: books_categories
              columns:
                - column:
                    name: book_id
                    type: BIGINT
                    constraints:
                      nullable: false
                - column:
                    name: category_id
                    type: BIGINT
                    constraints:
                      nullable: false
          - addForeignKeyConstraint:
              baseTableName: books_categories
              baseColumnNames: book_id
              referencedTableName: books
              referencedColumnNames: id
              onDelete: CASCADE
              constraintName: fk_book_category_book
          - addForeignKeyConstraint:
              baseTableName: books_categories
              baseColumnNames: category_id
              referencedTableName: categories
              referencedColumnNames: id
              onDelete: CASCADE
              constraintName: fk_book_category_category
