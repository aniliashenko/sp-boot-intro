databaseChangeLog:
  - changeSet:
      id: 1-insert-roles
      author: anton
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: role
                  value: ROLE_USER
        - insert:
            tableName: roles
            columns:
              - column:
                  name: id
                  valueNumeric: 2
              - column:
                  name: role
                  value: ROLE_ADMIN

  - changeSet:
      id: 2-insert-admin-user
      author: anton
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: email
                  value: admin@example.com
              - column:
                  name: password
                  value: $2a$10$7qbn4cr6u/URZY4OjByX8uw6a5cKDvKtOARpXegXObmuG1NdSxyvO  # password: admin123
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
                  value: User

  - changeSet:
      id: 3-assign-roles-to-admin
      author: anton
      changes:
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: role_id
                  valueNumeric: 2
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: role_id
                  valueNumeric: 1
